<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THLHUB Admin Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-image: linear-gradient(rgba(11, 11, 15, 0.85), rgba(11, 11, 15, 0.85)), url('image.png');
            background-size: cover;
            background-position: center;
        }

        .web-frame {
            width: 92%;
            max-width: 460px;
            height: 520px;
            background: rgba(18, 18, 24, 0.95);
            border: 2px solid #ff2a2a;
            border-radius: 22px;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 35px rgba(255, 42, 42, 0.6);
            position: relative;
        }

        .header-img {
            width: 75px;
            height: 75px;
            object-fit: contain;
            margin-bottom: 5px;
            filter: drop-shadow(0 0 10px rgba(255, 42, 42, 0.8));
        }

        h1 {
            font-size: 28px;
            margin: 10px 0 5px 0;
            color: #ff3b3b;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(255, 59, 59, 0.7);
            font-weight: 800;
        }

        p.subtitle {
            font-size: 14px;
            color: #d0d0d0;
            margin-bottom: 20px;
            text-align: center;
        }

        .search-box {
            width: 100%;
            padding: 12px 18px;
            background: #15151c;
            border: 1px solid #ff2a2a;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
        }

        .tab-container {
            display: flex;
            gap: 8px;
            width: 100%;
            background: #15151c;
            padding: 6px;
            border-radius: 12px;
            border: 1px solid #ff2a2a;
            margin-bottom: 15px;
            overflow-x: auto;
        }

        .tab-btn {
            background-color: transparent;
            color: #ccc;
            border: none;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }

        .tab-btn.active {
            background-color: #ff2a2a;
            color: white;
            box-shadow: 0 0 12px rgba(255, 42, 42, 0.9);
        }

        .content-box {
            width: 100%;
            background: rgba(25, 25, 35, 0.9);
            padding: 15px;
            border-radius: 12px;
            border: 1px dashed rgba(255, 42, 42, 0.5);
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .script-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f1f2b;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
        }

        .script-name {
            font-size: 14px;
            color: #fff;
            word-break: break-all;
            max-width: 65%;
            font-weight: 600;
        }

        /* Ở ngoài trang chủ CHỈ CÓ NÚT MỞ TAB */
        .link-btn {
            background-color: #00bfff;
            color: white;
            border: none;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .link-btn:active { transform: scale(0.9); }

        /* NÚT 3 GẠCH BÊN TRÁI */
        .hamburger-menu {
            position: fixed; bottom: 20px; left: 20px;
            background: #181822; border: 2px solid #ff2a2a; border-radius: 12px;
            width: 45px; height: 45px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 5px; cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 42, 42, 0.5); z-index: 100;
        }
        .hamburger-menu span { width: 22px; height: 3px; background: #ff2a2a; border-radius: 2px; }

        .side-popup {
            display: none; position: fixed; bottom: 75px; left: 20px;
            background: #181822; border: 2px solid #ff2a2a; border-radius: 12px;
            width: 170px; padding: 10px; z-index: 100; box-shadow: 0 0 20px rgba(255, 42, 42, 0.6);
        }
        .side-popup button {
            width: 100%; background: transparent; color: white; border: none;
            padding: 10px; text-align: left; font-size: 14px; font-weight: bold;
            cursor: pointer; border-radius: 6px;
        }
        .side-popup button:hover { background: #ff2a2a; }

        /* GIAO DIỆN DASHBOARD ADMIN (CHUẨN HÌNH ẢNH) */
        .admin-dashboard {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f0f14; z-index: 2000; display: none; flex-direction: row; color: #fff;
        }
        .admin-sidebar {
            width: 220px; background: #14141c; border-right: 2px solid #ff2a2a; padding: 20px; display: flex; flex-direction: column; gap: 10px;
        }
        .admin-sidebar h2 { font-size: 18px; color: #ff3b3b; margin-bottom: 20px; text-align: center; }
        .sidebar-btn {
            background: transparent; color: #ccc; border: none; padding: 12px; text-align: left; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s;
        }
        .sidebar-btn.active, .sidebar-btn:hover { background: #ff2a2a; color: white; }

        .admin-main {
            flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; background: #111118;
        }
        .admin-header-title {
            font-size: 20px; color: #00ffcc; border-bottom: 1px solid #333; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .admin-card {
            background: #181822; border: 1px solid #ff2a2a; border-radius: 14px; padding: 20px; box-shadow: 0 0 15px rgba(255,42,42,0.2);
        }
        .admin-table {
            width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px;
        }
        .admin-table th, .admin-table td {
            border: 1px solid #333; padding: 10px; text-align: left;
        }
        .admin-table th { background: #222230; color: #00ffcc; }
        .admin-input {
            width: 100%; padding: 8px; background: #111; border: 1px solid #444; border-radius: 6px; color: #fff; font-size: 13px;
        }
        .admin-action-btn {
            padding: 6px 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 12px; margin-right: 4px;
        }
        .btn-save-row { background: #00ffcc; color: #000; }
        .btn-del-row { background: #ff3b3b; color: #fff; }

        /* TOAST THÔNG BÁO */
        #toast {
            visibility: hidden; min-width: 200px; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 10px; position: fixed; z-index: 4000; left: 50%; bottom: 30px; transform: translateX(-50%); border: 1px solid #00ffcc; font-size: 14px;
        }
        #toast.show { visibility: visible; animation: fadein 0.3s, fadeout 0.3s 2.0s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

    <!-- THÔNG BÁO BAN ĐẦU -->
    <div class="choice-modal" id="notificationModal" style="display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; justify-content: center; align-items: center;">
        <div style="width: 85%; max-width: 320px; background: #181825; border: 2px solid #ff2a2a; border-radius: 15px; padding: 20px; text-align: center;">
            <h3 style="color: #ff3b3b; margin-top: 0;">⚠️ THÔNG BÁO</h3>
            <p style="font-size:13px; color:#ddd;">Web mới tạo nên gặp nhiều lỗi chưa fix, admin đang fix lỗi sẽ sớm thôi!</p>
            <button onclick="closeModal()" style="width: 100%; margin-top: 10px; padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; background: #ff2a2a; color: white;">Đã hiểu</button>
        </div>
    </div>

    <!-- NÚT 3 GẠCH BÊN TRÁI -->
    <div class="hamburger-menu" onclick="toggleSideMenu()">
        <span></span><span></span><span></span>
    </div>

    <div class="side-popup" id="sidePopup">
        <button onclick="switchView('home')">🏠 Trang chủ</button>
        <button onclick="checkAdminPassword()">⚙️ Quản lý Admin</button>
    </div>

    <!-- GIAO DIỆN DASHBOARD ADMIN (CHUẨN DASHBOARD) -->
    <div class="admin-dashboard" id="adminDashboard">
        <div class="admin-sidebar">
            <h2>THLHUB Admin</h2>
            <button class="sidebar-btn active">📊 Dashboard</button>
            <button class="sidebar-btn">👥 Users</button>
            <button class="sidebar-btn" onclick="switchAdminTab('links')">🔗 Links Management</button>
            <button class="sidebar-btn" onclick="switchAdminTab('scripts')">📜 Script Library</button>
            <button class="sidebar-btn" onclick="closeAdminDashboard()" style="margin-top: auto; background: #ff3b3b; color: white;">❌ Thoát Admin</button>
        </div>
        <div class="admin-main">
            <div class="admin-header-title">
                <span>Quản Lý Hệ Thống & Script Hack</span>
                <button onclick="saveAdminData()" style="background: #00ffcc; color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;">💾 Lưu Thay Đổi</button>
            </div>

            <!-- BẢNG QUẢN LÝ LINK & SCRIPT -->
            <div class="admin-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <strong style="color: #ff3b3b;">Danh Sách Script & Link Gắn Vào</strong>
                    <button onclick="addNewScriptInput()" class="admin-action-btn btn-save-row">➕ Thêm Mới</button>
                </div>
                <div style="overflow-x: auto;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Tên Script</th>
                                <th>Link Mở Tab Mới</th>
                                <th>Nội Dung Script (Sao chép)</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="adminTableBody">
                            <!-- Dữ liệu được load bằng JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- GIAO DIỆN CHÍNH -->
    <div class="web-frame">
        <div id="homeView" style="width:100%; height:100%; display:flex; flex-direction:column; align-items:center;">
            <img src="image.png" alt="Logo" class="header-img">
            <h1>THLHUB</h1>
            <p class="subtitle">các script hack đều ở đây</p>

            <input type="text" class="search-box" id="searchInput" placeholder="🔍 Tìm kiếm script..." onkeyup="renderScripts()">

            <div class="tab-container" id="mainTabContainer"></div>

            <div class="content-box" id="display-content"></div>
        </div>
    </div>

    <div id="toast">Thành công!</div>

    <script>
        let scriptData = [
            { name: "Hack Roblox V1", link: "https://example.com/script1", content: "loadstring(game:HttpGet('script1'))()" },
            { name: "Script Tổng Hợp", link: "https://example.com/script2", content: "loadstring(game:HttpGet('script2'))()" }
        ];

        let currentTabIdx = 0;

        window.onload = function() {
            let saved = localStorage.getItem("thlhub_custom_scripts");
            if (saved) scriptData = JSON.parse(saved);
            renderTabs();
            renderScripts();
        };

        function closeModal() {
            document.getElementById("notificationModal").style.display = "none";
        }

        // KIỂM TRA MẬT KHẨU ADMIN
        function checkAdminPassword() {
            document.getElementById("sidePopup").style.display = "none";
            let pass = prompt("Nhập mật khẩu Admin:");
            if (pass === "admin123") {
                openAdminDashboard();
            } else if (pass !== null) {
                alert("Sai mật khẩu!");
            }
        }

        function openAdminDashboard() {
            document.getElementById("adminDashboard").style.display = "flex";
            renderAdminTable();
        }

        function closeAdminDashboard() {
            document.getElementById("adminDashboard").style.display = "none";
            renderTabs();
            renderScripts();
        }

        function renderAdminTable() {
            let tbody = document.getElementById("adminTableBody");
            tbody.innerHTML = "";
            scriptData.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td><input type="text" class="admin-input" id="admName_${index}" value="${item.name}"></td>
                        <td><input type="text" class="admin-input" id="admLink_${index}" value="${item.link}"></td>
                        <td><input type="text" class="admin-input" id="admContent_${index}" value="${item.content}"></td>
                        <td>
                            <button class="admin-action-btn btn-del-row" onclick="removeAdminScript(${index})">Xóa</button>
                        </td>
                    </tr>
                `;
            });
        }

        function addNewScriptInput() {
            scriptData.push({ name: "Script Mới", link: "", content: "" });
            renderAdminTable();
        }

        function removeAdminScript(index) {
            scriptData.splice(index, 1);
            renderAdminTable();
        }

        function saveAdminData() {
            scriptData.forEach((item, index) => {
                let nameEl = document.getElementById(`admName_${index}`);
                let linkEl = document.getElementById(`admLink_${index}`);
                let contentEl = document.getElementById(`admContent_${index}`);
                if(nameEl) item.name = nameEl.value;
                if(linkEl) item.link = linkEl.value;
                if(contentEl) item.content = contentEl.value;
            });
            localStorage.setItem("thlhub_custom_scripts", JSON.stringify(scriptData));
            showToast("Đã lưu dữ liệu thành công!");
            renderAdminTable();
        }

        // MENU SIDEBAR 3 GẠCH
        function toggleSideMenu() {
            let popup = document.getElementById("sidePopup");
            popup.style.display = (popup.style.display === "block") ? "none" : "block";
        }

        // RENDER GIAO DIỆN CHÍNH
        function renderTabs() {
            let container = document.getElementById("mainTabContainer");
            container.innerHTML = "";
            scriptData.forEach((item, idx) => {
                container.innerHTML += `<button class="tab-btn ${idx === currentTabIdx ? 'active' : ''}" onclick="switchTab(${idx})">${item.name}</button>`;
            });
        }

        function switchTab(idx) {
            currentTabIdx = idx;
            renderTabs();
            renderScripts();
        }

        function renderScripts() {
            let keyword = document.getElementById("searchInput").value.toLowerCase();
            let box = document.getElementById("display-content");
            box.innerHTML = "";

            scriptData.forEach((item) => {
                if (item.name.toLowerCase().includes(keyword) || keyword === "") {
                    box.innerHTML += `
                        <div class="script-item">
                            <span class="script-name">${item.name}</span>
                            <button class="link-btn" onclick="openLink('${item.link}')">Mở Tab</button>
                        </div>
                    `;
                }
            });
        }

        function openLink(url) {
            if (url) {
                window.open(url, '_blank');
            } else {
                alert("Chưa có link được gắn cho mục này!");
            }
        }

        function showToast(msg) {
            let t = document.getElementById("toast");
            t.innerText = msg;
            t.className = "show";
            setTimeout(() => { t.className = t.className.replace("show", ""); }, 2300);
        }
    </script>
</body>
</html>
