<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THL HUB HACK - Kho Chia Sẻ Script & Hack RBLX</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: linear-gradient(rgba(11, 11, 20, 0.9), rgba(11, 11, 20, 0.9)), url('image.png');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 50px;
        }

        /* HEADER BANNER */
        .header-banner {
            width: 92%;
            max-width: 1100px;
            background: linear-gradient(135deg, #18182f 0%, #121223 100%);
            border: 1px solid #2a2a4e;
            border-radius: 18px;
            padding: 35px 40px;
            margin-top: 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        .brand-title {
            font-size: 14px;
            letter-spacing: 2px;
            color: #00ffff;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .main-heading {
            font-size: 36px;
            font-weight: 900;
            margin: 0 0 10px 0;
            background: linear-gradient(90deg, #ffffff, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sub-heading {
            font-size: 14px;
            color: #b2bec3;
            margin-bottom: 20px;
        }
        .stats-badge {
            display: inline-block;
            background: #1e1e3f;
            border: 1px solid #3f3f74;
            border-radius: 10px;
            padding: 8px 16px;
            font-size: 13px;
        }
        .stats-badge span {
            font-weight: bold;
            color: #00cec9;
            font-size: 18px;
            display: block;
        }

        /* SEARCH & FILTER BAR */
        .filter-container {
            width: 92%;
            max-width: 1100px;
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .search-box {
            flex: 1;
            min-width: 260px;
            padding: 14px 20px;
            background: #131324;
            border: 1px solid #2d2d54;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        .search-box:focus { border-color: #6c5ce7; box-shadow: 0 0 12px rgba(108, 92, 231, 0.4); }

        .category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 92%;
            max-width: 1100px;
        }
        .cat-btn {
            background: #16162c;
            color: #a4b0be;
            border: 1px solid #2d2d54;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .cat-btn.active, .cat-btn:hover {
            background: #6c5ce7;
            color: white;
            border-color: #81ecec;
            box-shadow: 0 0 15px rgba(108, 92, 231, 0.5);
        }

        /* SECTION TITLE */
        .section-title {
            width: 92%;
            max-width: 1100px;
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0 15px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid #6c5ce7;
            padding-left: 10px;
        }

        /* GRID CARDS LAYOUT */
        .cards-grid {
            width: 92%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        /* CARD ITEM VỚI HIỆU ỨNG LÓE SÁNG LIÊN TỤC */
        .script-card {
            background: linear-gradient(145deg, #16162d, #10101f);
            border-radius: 16px;
            border: 1px solid #2d2d54;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .script-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(108, 92, 231, 0.3);
            border-color: #6c5ce7;
        }

        /* HIỆU ỨNG LÓE SÁNG VỤT QUA LIÊN TỤC (SHINE ANIMATION) */
        .script-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                0deg,
                transparent 0%,
                rgba(255, 255, 255, 0.08) 50%,
                transparent 100%
            );
            transform: rotate(30deg);
            pointer-events: none;
            animation: shineMove 3.5s linear infinite;
        }
        @keyframes shineMove {
            0% { transform: translateY(-100%) rotate(30deg); }
            100% { transform: translateY(100%) rotate(30deg); }
        }

        /* THẺ TAG TRÊN Ô (HOT, VIP, MYTHIC...) */
        .card-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 2;
        }
        .badge-hot { background: #ff4757; color: white; animation: pulseHot 1.5s infinite; }
        .badge-vip { background: #ffa502; color: #1e1e1e; }
        .badge-mythic { background: #9b59b6; color: white; }
        .badge-free { background: #2ed573; color: white; }

        @keyframes pulseHot {
            0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(255, 71, 87, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }

        .card-thumbnail {
            width: 100%;
            height: 110px;
            background: #1e1e36;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            margin-bottom: 12px;
            border: 1px solid #2f2f59;
            position: relative;
            overflow: hidden;
        }
        
        .card-title {
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-author {
            font-size: 12px;
            color: #a4b0be;
            margin-bottom: 12px;
        }
        .card-author span {
            color: #ff4757;
            font-weight: bold;
        }

        /* NÚT THAO TÁC TRONG Ô */
        .card-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }
        .btn-copy {
            background: #ff4757;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }
        .btn-copy:hover { background: #ff6b81; }

        .btn-link {
            background: #00cec9;
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 206, 201, 0.4);
        }
        .btn-link:hover { background: #81ecec; }

        /* THÔNG BÁO TOAST */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #1e1e36;
            color: #fff;
            text-align: center;
            border-radius: 10px;
            padding: 14px;
            position: fixed;
            z-index: 4000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            border: 1px solid #00cec9;
            font-size: 14px;
            box-shadow: 0 0 25px rgba(0, 206, 201, 0.6);
            opacity: 0;
            transition: opacity 0.3s ease, bottom 0.3s ease;
        }
        #toast.show { visibility: visible; opacity: 1; bottom: 40px; }

        /* FOLLOW NOTICE FOOTER */
        .follow-banner {
            width: 92%;
            max-width: 1100px;
            text-align: center;
            padding: 15px;
            background: rgba(108, 92, 231, 0.15);
            border: 1px dashed #6c5ce7;
            border-radius: 12px;
            color: #00ffff;
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- BANNER CHÍNH -->
    <div class="header-banner">
        <div class="brand-title">THL HUB HACK</div>
        <h1 class="main-heading">Kho chia sẻ Script<br>& Hack RBLX</h1>
        <p class="sub-heading">Tất cả Script - Hack đã được ad kiểm chứng an toàn tuyệt đối!</p>
        <div class="stats-badge">
            <span id="totalItemsCount">0</span>
            Tổng số mục
        </div>
    </div>

    <!-- Ô TÌM KIẾM -->
    <div class="filter-container">

    <!-- CÁC NÚT LỌC DANH MỤC -->

    <!-- DÒNG LỜI KÊU GỌI FOLLOW -->
    <div class="follow-banner">

    </div>

    <!-- KHU VỰC HIỂN THỊ SCRIPT -->
    <div class="section-title" id="titleScript">📜 Script Tổng Hợp</div>
    <div class="cards-grid" id="scriptGrid"></div>

    <!-- KHU VỰC HIỂN THỊ CLIENT / FILE HACK -->
    <div class="section-title" id="titleClient" style="border-left-color: #00cec9;">🎮 Client & File Hack Roblox</div>
    <div class="cards-grid" id="clientGrid"></div>

    <!-- THÔNG BÁO SAO CHÉP -->
    <div id="toast">📋 Đã sao chép chính xác 100% nội dung!</div>

    <script>
        let scriptsData = [

            },
            { 
                name: "Chilli Hub V8",

                tag: "FREE", 
                tagType: "badge-free",

                content: "loadstring(game:HttpGet(\"https://id.tomroblox.com/raw/kairoblox/chilli-x-venyx-v8-finder-free-9836\"))()" 
            },
            { 
                name: "chili nhiều thứ tiếng", 
                author: "TienKhanh", 
                tag: "VIP", 
                tagType: "badge-vip", 
                icon: "🌐",
                content: "loadstring(game:HttpGet(\"https://raw.githubusercontent.com/tienkhanh1/spicy/main/Chilli.lua\"))()" 
            },
            { 
                name: "kaitunmirage", 
                author: "Kadit9999", 
                tag: "MYTHIC", 
                tagType: "badge-mythic", 
                icon: "🌌",
                content: "loadstring(game:HttpGet(\"https://raw.githubusercontent.com/kadit9999/stealanegg/refs/heads/main/kaitunmirage.lua\"))()" 
            },
            { 
                name: "voryken", 
                author: "Voryken", 
                tag: "VIP", 
                tagType: "badge-vip", 
                icon: "🛡️",
                content: "loadstring(game:HttpGet(\"https://codes.voryken.com/raw/iupos6\"))()" 
            },
            { 
                name: "x hop", 
                author: "THLHUB", 
                tag: "HOT", 
                tagType: "badge-hot", 
                icon: "🚀",
                content: "loadstring(game:HttpGet(\"https://pastefy.app/opvKMzxR/raw\"))()" 
            },
            { 
                name: "Figgy hub", 
                author: "Luarmor", 
                tag: "FREE", 
                tagType: "badge-free", 
                icon: "🎯",
                content: "loadstring(game:HttpGet(\"https://api.luarmor.net/files/v4/loaders/91ad82d753e1318189c4e249d56e7dcf.lua\"))()" 
            },
            { 
                name: "Tele 1 giây", 
                author: "Heavenly", 
                tag: "HOT", 
                tagType: "badge-hot", 
                icon: "⚡",
                content: "loadstring(game:HttpGet(\"https://raw.githubusercontent.com/heavenlylocked05/Heaven-Hub-Steal-An-Egg-Updated/refs/heads/main/obfuscated.lua.txt\"))()" 
            },
            { 
                name: "Ajj Finder Egg", 
                author: "Ajj", 
                tag: "FREE", 
                tagType: "badge-free", 
                icon: "🥚",
                content: "loadstring(game:HttpGet(\"https://api.luarmor.net/files/v4/loaders/611fa890357bf2439c1b54c9003ccf19.lua\"))()" 
            }
        ];

        let clientsData = [
            { 
                name: "Delta QT v13 ios", 
                author: "Delta Team", 
                tag: "iOS", 
                tagType: "badge-mythic", 
                icon: "🍏",
                link: "https://www.mediafire.com/file/9hpa3z29e4e50gu/Delta_QT_v13_ios.ipa/file" 
            },
            { 
                name: "Delta X V107 apk", 
                author: "Delta Team", 
                tag: "Android", 
                tagType: "badge-vip", 
                icon: "🤖",
                link: "https://www.mediafire.com/file/zuc3n08ox5oyufy/Delta_X_V107_.apk/file" 
            }
        ];

        let currentFilter = 'all';

        window.onload = function() {
            renderData();
        };

        function filterCategory(type) {
            currentFilter = type;
            document.getElementById('tabAll').className = type === 'all' ? 'cat-btn active' : 'cat-btn';
            document.getElementById('tabScript').className = type === 'script' ? 'cat-btn active' : 'cat-btn';
            document.getElementById('tabClient').className = type === 'client' ? 'cat-btn active' : 'cat-btn';
            renderData();
        }

        function renderData() {
            let keyword = document.getElementById("searchInput").value.toLowerCase();
            let scriptGrid = document.getElementById("scriptGrid");
            let clientGrid = document.getElementById("clientGrid");
            let titleScript = document.getElementById("titleScript");
            let titleClient = document.getElementById("titleClient");

            scriptGrid.innerHTML = "";
            clientGrid.innerHTML = "";

            let filteredScripts = scriptsData.filter(item => 
                item.name.toLowerCase().includes(keyword) || item.author.toLowerCase().includes(keyword)
            );

            let filteredClients = clientsData.filter(item => 
                item.name.toLowerCase().includes(keyword) || item.author.toLowerCase().includes(keyword)
            );

            document.getElementById("totalItemsCount").innerText = filteredScripts.length + filteredClients.length;

            if (currentFilter === 'all' || currentFilter === 'script') {
                titleScript.style.display = "flex";
                scriptGrid.style.display = "grid";
                filteredScripts.forEach((item) => {
                    scriptGrid.innerHTML += `
                        <div class="script-card">
                            <div class="card-badge ${item.tagType}">${item.tag}</div>
                            <div>
                                <div class="card-thumbnail">${item.icon}</div>
                                <div class="card-title" title="${item.name}">${item.name}</div>
                                <div class="card-author">Roblox - bởi <span>${item.author}</span></div>
                            </div>
                            <button class="card-btn btn-copy" onclick="executeCopy('${item.content.replace(/'/g, "\\'")}')">📋 Sao chép Script</button>
                        </div>
                    `;
                });
            } else {
                titleScript.style.display = "none";
                scriptGrid.style.display = "none";
            }

            if (currentFilter === 'all' || currentFilter === 'client') {
                titleClient.style.display = "flex";
                clientGrid.style.display = "grid";
                filteredClients.forEach((item) => {
                    clientGrid.innerHTML += `
                        <div class="script-card">
                            <div class="card-badge ${item.tagType}">${item.tag}</div>
                            <div>
                                <div class="card-thumbnail">${item.icon}</div>
                                <div class="card-title" title="${item.name}">${item.name}</div>
                                <div class="card-author">Roblox - bởi <span>${item.author}</span></div>
                            </div>
                            <button class="card-btn btn-link" onclick="openLink('${item.link}')">📥 Tải Xuống</button>
                        </div>
                    `;
                });
            } else {
                titleClient.style.display = "none";
                clientGrid.style.display = "none";
            }
        }

        function openLink(url) {
            window.open(url, '_blank');
        }

        function executeCopy(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast();
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = "fixed";
            textarea.style.top = "0";
            textarea.style.left = "0";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                alert("Không thể sao chép tự động!");
            }
            document.body.removeChild(textarea);
        }

        let toastTimer;
        function showToast() {
            let t = document.getElementById("toast");
            t.classList.add("show");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                t.classList.remove("show");
            }, 2500);
        }
    </script>
</body>
