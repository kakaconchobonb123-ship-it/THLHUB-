<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THLHUB Hub</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-image: linear-gradient(rgba(11, 11, 15, 0.85), rgba(11, 11, 15, 0.85)), url('image.png');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        /* HIỆU ỨNG MƯA ĐỎ RƠI NỀN SAU */
        .rain-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }
        .rain-drop {
            position: absolute;
            background: linear-gradient(transparent, #ff2a2a);
            width: 2px;
            height: 35px;
            opacity: 0.7;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-50px); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(105vh); opacity: 0; }
        }

        /* KHUNG WEB CHÍNH */
        .web-frame {
            width: 95%;
            max-width: 520px;
            height: 700px;
            background: rgba(18, 18, 24, 0.9);
            backdrop-filter: blur(14px);
            border: 2px solid #ff2a2a;
            border-radius: 24px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 50px rgba(255, 42, 42, 0.5);
            position: relative;
            z-index: 10;
            animation: fadeInSmooth 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInSmooth {
            0% { opacity: 0; transform: translateY(25px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header-img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-top: 5px;
            margin-bottom: 5px;
            filter: drop-shadow(0 0 14px rgba(255, 42, 42, 0.9));
        }

        h1 {
            font-size: 26px;
            margin: 5px 0;
            color: #ff3b3b;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 59, 59, 0.8);
            font-weight: 800;
        }

        p.subtitle {
            font-size: 14px;
            color: #d0d0d0;
            margin-bottom: 15px;
            text-align: center;
            border-right: 2px solid #ff2a2a;
            white-space: nowrap;
            overflow: hidden;
            animation: typing 3.5s steps(30, end), blink-caret 0.75s step-end infinite;
        }
        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: #ff2a2a; } }

        .search-box {
            width: 100%;
            padding: 12px 18px;
            background: #15151c;
            border: 1px solid #ff2a2a;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
            transition: 0.3s;
        }
        .search-box:focus { box-shadow: 0 0 12px rgba(255, 42, 42, 0.6); }

        .tab-container {
            display: flex;
            gap: 10px;
            width: 100%;
            background: #15151c;
            padding: 6px;
            border-radius: 12px;
            border: 1px solid #ff2a2a;
            margin-bottom: 12px;
        }

        .tab-btn, .link-btn, .copy-btn {
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.2s;
            user-select: none;
        }
        .tab-btn:active, .link-btn:active, .copy-btn:active {
            transform: translateY(3px) scale(0.97);
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.4) !important;
        }

        .tab-btn {
            flex: 1;
            background-color: transparent;
            color: #ccc;
            border: none;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
        }
        .tab-btn.active {
            background-color: #ff2a2a;
            color: white;
            box-shadow: 0 0 15px rgba(255, 42, 42, 0.9);
        }

        .content-box {
            width: 100%;
            background: rgba(25, 25, 35, 0.95);
            padding: 12px;
            border-radius: 14px;
            border: 1px dashed rgba(255, 42, 42, 0.6);
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 400px;
        }

        .script-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f1f2b;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #444;
            transition: 0.2s;
        }
        .script-item:hover { border-color: #ff2a2a; }

        .script-name {
            font-size: 13px;
            color: #fff;
            word-break: break-all;
            max-width: 62%;
            font-weight: 600;
        }

        .link-btn {
            background-color: #00bfff;
            color: white;
            border: none;
            padding: 7px 12px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            box-shadow: 0 3px 0 #0088cc;
        }
        .link-btn:hover { background-color: #33ccff; }

        .copy-btn {
            background-color: #ff2a2a;
            color: white;
            border: none;
            padding: 7px 12px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            box-shadow: 0 3px 0 #b31b1b;
        }
        .copy-btn:hover { background-color: #ff4d4d; }

        /* NÚT 3 GẠCH BÊN TRÁI (ĐÃ ẨN QUẢN LÝ ADMIN) */
        .hamburger-menu {
            position: fixed; bottom: 20px; left: 20px;
            background: rgba(24, 24, 34, 0.9); border: 2px solid #ff2a2a; border-radius: 12px;
            width: 45px; height: 45px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 5px; cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 42, 42, 0.5); z-index: 100;
            transition: 0.3s;
        }
        .hamburger-menu:hover { transform: scale(1.1); }
        .hamburger-menu span { width: 22px; height: 3px; background: #ff2a2a; border-radius: 2px; }

        .side-popup {
            display: none; position: fixed; bottom: 75px; left: 20px;
            background: rgba(24, 24, 34, 0.95); backdrop-filter: blur(10px);
            border: 2px solid #ff2a2a; border-radius: 12px;
            width: 170px; padding: 10px; z-index: 100; box-shadow: 0 0 25px rgba(255, 42, 42, 0.6);
        }
        .side-popup button {
            width: 100%; background: transparent; color: white; border: none;
            padding: 10px; text-align: left; font-size: 14px; font-weight: bold;
            cursor: pointer; border-radius: 6px;
        }

        /* THÔNG BÁO TOAST */
        #toast {
            visibility: hidden; min-width: 240px; background-color: #1a1a24; color: #fff; text-align: center; border-radius: 10px; padding: 14px; position: fixed; z-index: 4000; left: 50%; bottom: 40px; transform: translateX(-50%); border: 1px solid #00ffcc; font-size: 14px; box-shadow: 0 0 25px rgba(0,255,204,0.6);
            opacity: 0; transition: opacity 0.3s ease, bottom 0.3s ease;
        }
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
    </style>
</head>
<body>

    <!-- HIỆU ỨNG MƯA ĐỎ RƠI NỀN SAU -->
    <div class="rain-container" id="rainContainer"></div>

    <!-- THÔNG BÁO BAN ĐẦU -->
    <div class="choice-modal" id="notificationModal" style="display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 3000; justify-content: center; align-items: center;">
        <div style="width: 85%; max-width: 320px; background: rgba(24, 24, 37, 0.95); border: 2px solid #ff2a2a; border-radius: 15px; padding: 20px; text-align: center; box-shadow: 0 0 30px rgba(255,42,42,0.5);">
            <h3 style="color: #ff3b3b; margin-top: 0;">⚠️ THÔNG BÁO</h3>
            <p style="font-size:13px; color:#ddd;">Web mới tạo nên gặp nhiều lỗi chưa fix, admin đang fix lỗi sẽ sớm thôi!</p>
            <button onclick="closeModal()" style="width: 100%; padding: 10px; margin-top: 10px; background: #00ffcc; color: #000; border: none; font-weight: bold; border-radius: 6px; cursor: pointer;">Đã hiểu</button>
        </div>
    </div>

    <!-- NÚT 3 GẠCH BÊN TRÁI -->
    <div class="hamburger-menu" onclick="toggleSideMenu()">
        <span></span><span></span><span></span>
    </div>

    <div class="side-popup" id="sidePopup">
        <button onclick="alert('Đang hiển thị trang chủ!')">🏠 Trang chủ</button>
    </div>

    <!-- GIAO DIỆN CHÍNH -->
    <div class="web-frame">
        <div id="homeView" style="width:100%; height:100%; display:flex; flex-direction:column; align-items:center;">
            <img src="image.png" alt="Logo" class="header-img fade-in-text">
            <h1 class="fade-in-text delay-1">THLHUB</h1>
            <p class="subtitle fade-in-text delay-2">các script hack đều ở đây</p>

            <input type="text" class="search-box fade-in-text delay-3" id="searchInput" placeholder="🔍 Tìm kiếm..." onkeyup="renderCurrentTabContent()">

            <div class="tab-container fade-in-text delay-3">
                <button class="tab-btn active" id="mainTab1" onclick="switchMainTab(1)">🎮 Hack Roblox</button>
                <button class="tab-btn" id="mainTab2" onclick="switchMainTab(2)">📜 Script Tổng Hợp</button>
            </div>

            <div class="content-box fade-in-text delay-3" id="display-content"></div>
        </div>
    </div>

    <!-- THÔNG BÁO TOAST THÀNH CÔNG -->
    <div id="toast">📋 Đã sao chép chính xác nội dung!</div>

    <script>
        // --- BẠN CÓ THỂ SỬA TRỰC TIẾP LINK VÀ SCRIPT TẠI ĐÂY ---
        let linksData = [
            { name: "Delta QT v13 ios", link: "https://www.mediafire.com/file/9hpa3z29e4e50gu/Delta_QT_v13_ios.ipa/file" },
            { name: "Delta X V107 apk", link: "https://www.mediafire.com/file/zuc3n08ox5oyufy/Delta_X_V107_.apk/file" }
        ];

        let scriptsData = [
            { name: "Chilli Hub V8", content: "loadstring(game:HttpGet(\"https://id.tomroblox.com/raw/kairoblox/chilli-x-venyx-v8-finder-free-9836\"))()" },
            { name: "Figgy hub", content: "loadstring(game:HttpGet(\"https://api.luarmor.net/files/v4/loaders/91ad82d753e1318189c4e249d56e7dcf.lua\"))()" },
            { name: "Tele 1 giây", content: "loadstring(game:HttpGet(\"https://raw.githubusercontent.com/heavenlylocked05/Heaven-Hub-Steal-An-Egg-Updated/refs/heads/main/obfuscated.lua.txt\"))()" },
            { name: "Ajj Finder Egg", content: "loadstring(game:HttpGet(\"https://api.luarmor.net/files/v4/loaders/611fa890357bf2439c1b54c9003ccf19.lua\"))()" }
        ];

        window.onload = function() {
            renderCurrentTabContent();
        };

        // Thống kê lượt truy cập
        (function() {
            let visits = localStorage.getItem("thlhub_visits_count");
            if (!visits) visits = 1;
            else if (!sessionStorage.getItem("visited_session")) {
                visits = parseInt(visits) + 1;
                sessionStorage.setItem("visited_session", "true");
            }
            localStorage.setItem("thlhub_visits_count", visits);
        })();

        window.addEventListener('DOMContentLoaded', () => {
            const rainContainer = document.getElementById('rainContainer');
            const dropCount = 25;
            for(let i=0; i<dropCount; i++) {
                let drop = document.createElement('div');
                drop.className = 'rain-drop';
                drop.style.left = Math.random() * 100 + '%';
                drop.style.top = (Math.random() * -50) + 'px';
                drop.style.animationDuration = (Math.random() * 2 + 2) + 's';
                drop.style.animationDelay = (Math.random() * 3) + 's';
                rainContainer.appendChild(drop);
            }
        });

        function closeModal() {
            document.getElementById("notificationModal").style.display = "none";
        }

        function toggleSideMenu() {
            let popup = document.getElementById("sidePopup");
            popup.style.display = (popup.style.display === "block") ? "none" : "block";
        }

        function switchMainTab(tabNum) {
            currentMainTab = tabNum;
            document.getElementById("mainTab1").className = tabNum === 1 ? "tab-btn active" : "tab-btn";
            document.getElementById("mainTab2").className = tabNum === 2 ? "tab-btn active" : "tab-btn";
            renderCurrentTabContent();
        }

        let currentMainTab = 1;

        function renderCurrentTabContent() {
            let keyword = document.getElementById("searchInput").value.toLowerCase();
            let box = document.getElementById("display-content");
            box.innerHTML = "";

            if (currentMainTab === 1) {
                linksData.forEach((item) => {
                    if (item.name.toLowerCase().includes(keyword) || keyword === "") {
                        box.innerHTML += `
                            <div class="script-item">
                                <span class="script-name">${item.name}</span>
                                <button class="link-btn" onclick="openLink('${item.link}')">Mở Tab</button>
                            </div>
                        `;
                    }
                });
            } else {
                scriptsData.forEach((item, idx) => {
                    if (item.name.toLowerCase().includes(keyword) || keyword === "") {
                        box.innerHTML += `
                            <div class="script-item">
                                <span class="script-name">${item.name}</span>
                                <button class="copy-btn" id="copyBtn_${idx}">Sao chép</button>
                            </div>
                        `;
                    }
                });

                scriptsData.forEach((item, idx) => {
                    let btn = document.getElementById(`copyBtn_${idx}`);
                    if(btn) {
                        let textToCopy = item.content;
                        btn.onclick = function() {
                            executeCopy(textToCopy);
                        };
                    }
                });
            }
        }

        function openLink(url) {
            if (url) {
                window.open(url.startsWith('http') ? url : 'https://' + url, '_blank');
            } else {
                alert("Chưa có link được gắn cho mục này!");
            }
        }

        function executeCopy(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast();
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = "fixed";
            textarea.style.top = "0";
            textarea.style.left = "0";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                let successful = document.execCommand('copy');
                if(successful) {
                    showToast();
                } else {
                    alert("Không thể sao chép tự động!");
                }
            } catch (err) {
                alert("Trình duyệt không hỗ trợ sao chép!");
            }
            document.body.removeChild(textarea);
        }

        let toastTimer;
        function showToast(customMsg) {
            let t = document.getElementById("toast");
            if(customMsg) t.innerText = customMsg;
            else t.innerText = "📋 Đã sao chép chính xác 100% nội dung!";
            
            t.classList.add("show");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                t.classList.remove("show");
            }, 2500);
        }
    </script>
</body>
</html>
