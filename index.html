<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THLHUB</title>
    <style>
        /* Thiết lập giao diện tổng quan và viền đỏ xung quanh màn hình */
        body {
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        .web-frame {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            border: 4px solid #ff2a2a; /* Viền đỏ yêu cầu */
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background-color: #1a1a1a;
            box-shadow: 0 0 20px rgba(255, 42, 42, 0.4);
            box-sizing: border-box;
            position: relative;
        }

        /* Hình ảnh phía trên chữ THLHUB */
        .header-img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #ff2a2a;
            margin-bottom: 10px;
            box-shadow: 0 0 10px rgba(255, 42, 42, 0.5);
        }

        /* Tiêu đề THLHUB */
        h1 {
            font-size: 28px;
            margin: 5px 0;
            color: #ff4d4d;
            letter-spacing: 2px;
            min-height: 35px;
        }

        /* Dòng phụ mô tả */
        p.subtitle {
            font-size: 14px;
            color: #b0b0b0;
            margin-bottom: 30px;
            min-height: 20px;
            text-align: center;
        }

        /* Khu vực chứa 2 Tab */
        .tab-container {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
        }

        /* Thiết kế nút Tab hiện đại */
        .tab-btn {
            background-color: #2a2a2a;
            color: white;
            border: 2px solid #ff2a2a;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
            flex: 1;
            text-align: center;
        }

        /* Hiệu ứng khi ấn xuống (Active) */
        .tab-btn:active {
            transform: scale(0.92); /* Thu nhỏ, tạo cảm giác bị ấn xuống */
            background-color: #ff2a2a;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Hiệu ứng nảy lên nhẹ khi rê chuột hoặc sau khi click */
        .tab-btn:hover {
            background-color: #3a3a3a;
            box-shadow: 0 0 10px rgba(255, 42, 42, 0.6);
        }

        /* Khung hiển thị nội dung khi bấm Tab */
        .content-box {
            margin-top: 25px;
            width: 100%;
            background: #222;
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed #444;
            text-align: center;
            font-size: 14px;
            color: #ddd;
        }
    </style>
</head>
<body>

    <div class="web-frame">
        <!-- Ảnh gắn trên chữ THLHUB (Sử dụng ảnh trực tiếp từ yêu cầu) -->
        <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD..." alt="THLHUB Logo" class="header-img" id="myImage">
        
        <!-- Tiêu đề và chữ hiện từ từ -->
        <h1 id="title-text"></h1>
        <p class="subtitle" id="sub-text"></p>

        <!-- 2 Tab lựa chọn -->
        <div class="tab-container">
            <button class="tab-btn" onclick="showContent('Hack Roblox')">1. Hack Roblox</button>
            <button class="tab-btn" onclick="showContent('Script')">2. Script</button>
        </div>

        <div class="content-box" id="display-content">
            Chọn một mục ở trên để hiển thị thông tin!
        </div>
    </div>

    <script>
        // Gán link ảnh chính xác bạn gửi vào thẻ img thông qua javascript hoặc base64
        // (Ở đây dùng link trực tiếp file ảnh của bạn)
        document.getElementById('myImage').src = "image.png";

        // Hiệu ứng chữ chạy từ từ nhưng nhanh
        const titleString = "THLHUB";
        const subString = "các script hack đều ở đây";
        
        let i = 0;
        let j = 0;

        function typeTitle() {
            if (i < titleString.length) {
                document.getElementById("title-text").innerHTML += titleString.charAt(i);
                i++;
                setTimeout(typeTitle, 80); // Tốc độ chạy chữ tiêu đề
            } else {
                typeSub();
            }
        }

        function typeSub() {
            if (j < subString.length) {
                document.getElementById("sub-text").innerHTML += subString.charAt(j);
                j++;
                setTimeout(typeSub, 40); // Tốc độ chạy chữ phụ nhanh hơn một chút
            }
        }

        // Bắt đầu hiệu ứng chạy chữ ngay khi load trang
        window.onload = function() {
            setTimeout(typeTitle, 300);
        };

        // Hàm xử lý khi bấm vào các Tab
        function showContent(tabName) {
            const box = document.getElementById("display-content");
            if (tabName === 'Hack Roblox') {
                box.innerHTML = "🚀 Danh sách các bản Hack Roblox mới nhất đang sẵn sàng!";
            } else {
                box.innerHTML = "📜 Kho tổng hợp các Script tổng hợp chất lượng cao!";
            }
        }
    </script>
</body>
</html>
